<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="PRD Orchestrator submission responses for Ideation, Program Charter, Build, and Reflection.">
<meta property="og:title" content="PRD Orchestrator · Submission"><meta property="og:description" content="The approved Q1–Q4 submission responses for PRD Orchestrator v0.3.8.">
<meta property="og:type" content="website"><meta property="og:url" content="https://vjra.us/prd-genie.html"><meta property="og:image" content="https://vjra.us/prd-genie-vp-og.png">
<title>PRD Orchestrator · Submission · vjra.us</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style id="shell-style">
  :root{--accent:#b85042;--ink:#1a1a2e;--muted:#767676;--bg:#f8f4ee;--surface:#f4f3f0;--card:#fff;--border:#e8e6e1;--green:#2d6a4f;--green-bg:#edf7f1}
  *{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:#2b2b2b;line-height:1.6;min-height:100vh}
  .loading{min-height:70vh;display:grid;place-items:center;color:var(--muted);font-size:.8rem}
  .submission-tabs{display:flex;justify-content:center;gap:.35rem;padding:0 2rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(248,244,238,.96);backdrop-filter:blur(8px);z-index:6;overflow-x:auto}
  .submission-tab{border:0;background:none;color:var(--muted);font:600 .75rem Inter,sans-serif;padding:.78rem 1.25rem;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
  .submission-tab:hover,.submission-tab.active{color:var(--accent)}.submission-tab.active{border-bottom-color:var(--accent)}
  .source-error{max-width:760px;margin:5rem auto;padding:1.2rem;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--muted)}
  @media(max-width:640px){.submission-tabs{justify-content:flex-start;padding:0 .5rem}.submission-tab{padding:.7rem .8rem}}
</style>
</head>
<body>
<header>
  <div><div class="kicker">vjra.us · IK Program</div><h1>PRD Orchestrator</h1><div class="header-sub">Four-part submission · accepted v0.3.8 evidence baseline</div></div>
  <div class="header-right"><span class="status-pill"><span class="status-dot"></span>v0.3.8 · Submission baseline</span><a class="back-link" href="prd-orchestrator.html">Project case study</a></div>
</header>
<nav class="submission-tabs" aria-label="Submission questions">
  <button class="submission-tab active" data-panel="q1-ideation">Q1 · Ideation</button>
  <button class="submission-tab" data-panel="q2-program-charter">Q2 · Program Charter</button>
  <button class="submission-tab" data-panel="q3-build-architecture">Q3 · Build</button>
  <button class="submission-tab" data-panel="q4-reflection">Q4 · Reflection</button>
</nav>
<main id="submission-content"><div class="loading">Loading approved submission content…</div></main>
<footer>PRD Orchestrator · Approved Q1–Q4 responses · v0.3.8 accepted submission evidence · August 2026</footer>
<script>
(async()=>{
  const ids=['q1-ideation','q2-program-charter','q3-build-architecture','q4-reflection'];
  const root=document.getElementById('submission-content');
  try{
    const response=await fetch('prd-genie-vp.html');
    if(!response.ok)throw new Error('Source page unavailable');
    const source=new DOMParser().parseFromString(await response.text(),'text/html');
    source.head.querySelectorAll('style').forEach(style=>{const copy=document.createElement('style');copy.textContent=style.textContent;document.head.insertBefore(copy,document.getElementById('shell-style'))});
    root.innerHTML='';
    ids.forEach(id=>{const section=source.getElementById(id);if(!section)throw new Error('Missing approved section: '+id);const copy=section.cloneNode(true);copy.classList.remove('active');root.appendChild(copy)});
    const tabs=[...document.querySelectorAll('.submission-tab')],panels=[...root.querySelectorAll('.panel')];
    const show=id=>{tabs.forEach(tab=>tab.classList.toggle('active',tab.dataset.panel===id));panels.forEach(panel=>panel.classList.toggle('active',panel.id===id));history.replaceState(null,'','#'+id);scrollTo({top:0,behavior:'smooth'})};
    tabs.forEach(tab=>tab.addEventListener('click',()=>show(tab.dataset.panel)));
    const initial=location.hash.slice(1);show(ids.includes(initial)?initial:ids[0]);
  }catch(error){root.innerHTML='<div class="source-error"><strong>Submission content could not be loaded.</strong><br>Please open the approved evidence dashboard or retry this page.</div>';console.error(error)}
})();
</script>
</body>
</html>
